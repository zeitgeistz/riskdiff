name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Runs this repo's own GitHub Action against its latest change.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: riskdiff
        uses: ./
        with:
          fail-on: ''
          sarif: 'true'
      - name: Check outputs
        env:
          HIGH: ${{ steps.riskdiff.outputs.high }}
          REPORT: ${{ steps.riskdiff.outputs.report }}
          SARIF: ${{ steps.riskdiff.outputs.sarif-file }}
        run: |
          test -n "$HIGH"
          grep -q '<!-- riskdiff -->' "$REPORT"
          node -e 'const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (s.version !== "2.1.0") process.exit(1)' "$SARIF"
          echo "high=$HIGH, report and SARIF OK"
